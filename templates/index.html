<!DOCTYPE html>
<html>
    <head>
        <title>Calculadora de Dano - RPG</title>
        <link rel="stylesheet" type="text/css" href="/static/style.css" />
        <script src="/static/index.js"></script>
    </head>
    <body onload="iniciar()">
        <div class="calculadora-dano">
            <div class="linha-container">
                <img  
                src="static/img/KOF97.png" 
                width="280" 
                height="100" 
                align="right"
            />
            </div>
            
            <div class="linha-container">
                <h2>Selecione um lutador</h2>
            </div>

            <div class="elementos-container">
                <div class="elemento personagem" id="terry">
                    <img 
                        src="static/img/terry_bogard.png" 
                        alt="terry" 
                        width="180" 
                        height="200"
                    />
                    <p>Terry Bogard</p>
                </div>
                <div class="elemento personagem" id="kyo">
                    <img
                        src="static/img/kyo_kusanagi.png"
                        alt="kyo"
                        width="200"
                        height="200"
                    />
                    <p>Kyo Kusanagi</p>
                </div>
                <div class="elemento personagem" id="benimaru">
                    <img
                        src="static/img/benimaru_nikaido.png"
                        alt="benimaru"
                        width="200"
                        height="200"
                    />
                    <p>Benimaru Nikaido </p>
                </div>
            </div>

            <div class="linha-container">
                <h2>Selecione uma habilidade</h2>
            </div>

            <div class="elementos-container">
                <div class="elemento arma" id="Tempestade_de_socos">
                    <img
                        src="static/img/soco.png"
                        alt="Soco"
                        width="150"
                        height="150"
                    />
                    <p>Tempestade de socos</p>
                </div>
                <div class="elemento arma" id="Chuva_de_Fogo">
                    <img
                        src="static/img/fogo.png"
                        alt="Fogo"
                        width="150"
                        height="150"
                    />
                    <p>Chuva de Fogo</p>
                </div>
                <div class="elemento arma" id="Fusao_de_Energia">
                    <img
                        src="static/img/esfera_eletrica.png"
                        alt="esfera_eletrica"
                        width="170"
                        height="150"
                    />
                    <p>Fusão de Energia</p>
                </div>
            </div>

            <div class="linha-container">
                <button id="calcular" type="button"><b>CALCULAR</b></button>
            </div>

            <div class="linha-container">
                <span id="dano"></span>
            </div>
        </div>
    </body>
<!--<footer><b>Desenvolvido por Anderson Reis| 2021 - BlueEdtech</b></footer> -->
</html>
